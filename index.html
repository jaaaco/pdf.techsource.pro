<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f2f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171615" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Privacy-first PDF toolkit - compress, merge, split, and OCR PDFs entirely in your browser" />
    <meta name="keywords" content="PDF, compress, merge, split, OCR, privacy, client-side, WebAssembly" />
    <title>PDF Toolkit - Privacy-First PDF Tools</title>
    <!--
      Applies a stored light/dark choice before first paint. Without this the
      page paints in the OS scheme and then flips one frame later, which is
      the white flash every dark-mode site gets wrong. Keep in sync with
      THEME_BOOTSTRAP in src/theme/mode.tsx.
    -->
    <script>try{var m=localStorage.getItem('pdf-toolkit-theme');if(m==='light'||m==='dark'){document.documentElement.setAttribute('data-theme',m)}}catch(e){}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
