# Netlify configuration for PDF Toolkit
# Optimized for static hosting with WASM support

[build]
  # Build command
  command = "npm run build"

  # Output directory
  publish = "dist"

  # Environment variables
  [build.environment]
    NODE_VERSION = "20"
    NPM_VERSION = "10"

# Baseline headers.
#
# Note on COEP: `Cross-Origin-Embedder-Policy: require-corp` used to be set
# here. It gates SharedArrayBuffer, which nothing in this codebase actually
# uses (src/workers/shared/wasm-loader.ts only feature-detects it and never
# branches on the result), and it blocks every cross-origin frame that does
# not send CORP - which includes ad and analytics iframes. It is deliberately
# not set. If a future feature needs threaded WASM, reintroduce it as
# `credentialless` and re-test third-party embeds.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin"

# Fingerprinted build output can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# WASM payloads and language data are large and versioned by path.
[[headers]]
  for = "/wasm-files/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/tesseract-data/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML is prerendered per route and regenerated on every deploy, so it must
# revalidate. Without this the blanket immutable rule that used to live on /*
# would pin a year-old copy of every page in intermediate caches.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Redirects live in public/_redirects so that the built dist/ is self-contained.

# Optimize build performance
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

## Lighthouse audits only on production after deploy is live
[[context.production.plugins]]
  package = "@netlify/plugin-lighthouse"

  [context.production.plugins.inputs.settings]
    preset = "desktop"

  [context.production.plugins.inputs.thresholds]
    performance = 0.8
    accessibility = 0.9
    best-practices = 0.9
    seo = 0.9

  [[context.production.plugins.inputs.audits]]
    url = "https://pdf.techsource.pro/"

  [[context.production.plugins.inputs.audits]]
    url = "https://pdf.techsource.pro/compress"

[context.production]
  command = "npm run build"

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"
